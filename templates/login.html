<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><style>body{font:16px Arial;background:#080b14;color:#eee;display:grid;place-items:center;min-height:100vh;margin:0}.box{width:min(360px,90vw);background:#121a2b;padding:28px;border-radius:16px}input,button{width:100%;padding:12px;margin-top:12px;box-sizing:border-box;border-radius:8px}button{background:#b7ff00;border:0;font-weight:bold;cursor:pointer}.err{color:#ff8ba0}</style></head><body><form class="box" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><h2>Desert Bloom Admin</h2><p>Sign in to view project enquiries.</p>{% if error %}<p class="err">{{ error }}</p>{% endif %}<label for="password">Admin password</label><input id="password" name="password" type="password" required autocomplete="current-password"><button type="submit">Login</button></form></body></html>
